[pytest]
asyncio_mode = strict
# model: torch·transformers가 필요한 테스트(작은 임의 모델 또는 실제 가중치). 기본 실행에서는 뺀다.
#   경량(기본):  python -m pytest -q
#   모델만:      python -m pytest -q -m model          (pip install -e .[judge,dev] 필요)
#   전체:        python -m pytest -q -m "model or not model"
markers =
    model: torch·transformers가 필요한 테스트 (pip install -e .[judge])
addopts = -m "not model"
